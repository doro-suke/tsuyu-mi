name: Tsuyu-mi Sync

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 00:00 UTC (日本時間 09:00) に実行
  workflow_dispatch: # 手動実行用

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run sync
        env:
          RAINDROP_API_KEY: ${{ secrets.RAINDROP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/sync.js 10
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bookmarks.json data/notebooklm_sources/*.md docs/index.html
          git commit -m "chore: auto-sync bookmarks [skip ci]" || echo "No changes to commit"
          git push
