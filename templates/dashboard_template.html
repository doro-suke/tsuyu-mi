<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesper - AI-Driven Curation Dashboard</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121214">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        /* アクティブなフィルターボタンのローズゴールドグラデーション */
        .filter-active {
            background: linear-gradient(135deg, #c8968c 0%, #e8c3b9 100%) !important;
            color: #121214 !important;
            border-color: transparent !important;
            font-weight: 700 !important;
            box-shadow: 0 4px 12px rgba(200, 150, 140, 0.2);
        }
        /* 既読状態の落ち着いたUI表現 */
        .status-read {
            opacity: 0.35;
            filter: grayscale(0.8);
            border-top-color: #2a2a30 !important;
        }
        /* カードのアニメーション transition */
        .article-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .article-card.hidden-item {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
            position: absolute;
            z-index: -1;
        }
        #articlesGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 2rem;
        }
        .stat-badge {
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            margin-left: 0.4rem;
            vertical-align: middle;
        }
        /* カスタムスクールバー（シックなダーク調） */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a30;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c8968c;
        }
    </style>
</head>
<body class="bg-[#121214] text-[#f4f4f5] font-sans min-h-screen antialiased selection:bg-[#c8968c] selection:text-[#121214]">
    <header class="bg-[#161619]/90 border-b border-[#222228] sticky top-0 z-20 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <!-- ローズゴールドの高級感あふれるグラデーションロゴ -->
                    <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-[#c8968c] via-[#e8c3b9] to-[#c8968c] bg-clip-text text-transparent">Vesper</h1>
                    <div id="readingProgress" class="hidden md:flex flex-col gap-1 w-48">
                        <div class="flex justify-between text-[9px] font-bold text-[#a1a1aa] uppercase tracking-wider">
                            <span>Knowledge Intake</span>
                            <span id="progressPercent" class="text-[#e8c3b9]">0%</span>
                        </div>
                        <div class="h-1 w-full bg-[#242429] rounded-full overflow-hidden">
                            <div id="progressBar" class="h-full bg-gradient-to-r from-[#c8968c] to-[#e8c3b9] transition-all duration-700 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 検索・フィルタUI -->
                <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                    <div class="relative flex-grow">
                        <input type="text" id="searchInput" placeholder="Vesper内の知識を探索..." class="w-full px-4 py-2 bg-[#1a1a1f] border border-[#2c2c34] text-white rounded-md focus:ring-2 focus:ring-[#c8968c] focus:border-[#c8968c] transition-all outline-none text-sm placeholder:text-gray-600">
                        <span id="searchCount" class="absolute right-3 top-2.5 text-xs text-[#a1a1aa] font-medium"></span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="filterPriority('all')" class="priority-btn flex-grow px-3 py-2 bg-[#1a1a1f] border border-[#2a2a2e] rounded-md text-xs text-[#a1a1aa] hover:bg-[#222228] transition-colors filter-active" data-priority="all">
                            All <span id="count-all" class="stat-badge bg-[#2a2a2e] text-[#f4f4f5] rounded-full">0</span>
                        </button>
                        <button onclick="filterPriority('high')" class="priority-btn flex-grow px-3 py-2 bg-[#1a1a1f] border border-[#2a2a2e] rounded-md text-xs text-red-400 hover:bg-red-950/20 hover:border-red-900/50 transition-colors" data-priority="high">
                            High <span id="count-high" class="stat-badge bg-red-950/40 text-red-300 rounded-full">0</span>
                        </button>
                        <button onclick="filterPriority('medium')" class="priority-btn flex-grow px-3 py-2 bg-[#1a1a1f] border border-[#2a2a2e] rounded-md text-xs text-amber-400 hover:bg-amber-950/20 hover:border-amber-900/50 transition-colors" data-priority="medium">
                            Mid <span id="count-medium" class="stat-badge bg-amber-950/40 text-amber-300 rounded-full">0</span>
                        </button>
                        <button onclick="filterPriority('low')" class="priority-btn flex-grow px-3 py-2 bg-[#1a1a1f] border border-[#2a2a2e] rounded-md text-xs text-[#8e8e93] hover:bg-[#222228] transition-colors" data-priority="low">
                            Low <span id="count-low" class="stat-badge bg-[#242429] text-[#8e8e93] rounded-full">0</span>
                        </button>
                    </div>
                    <div class="flex gap-1 border-l border-[#2c2c34] pl-2">
                        <button onclick="toggleShowRead()" id="toggleReadBtn" class="px-3 py-2 bg-[#1a1a1f] border border-[#2c2c34] rounded-md text-xs text-[#a1a1aa] hover:bg-[#222228] whitespace-nowrap transition-colors">
                            既読を表示中
                        </button>
                        <button onclick="copyReadIds()" class="px-3 py-2 bg-[#1a1a1f] border border-[#2c2c34] rounded-md text-xs text-green-400 hover:bg-green-950/20 transition-colors" title="既読にした記事のIDをコピーしてAIやスクリプトに渡せる">
                            ✔️
                        </button>
                        <button onclick="copyDeletedIds()" class="px-3 py-2 bg-[#1a1a1f] border border-[#2c2c34] rounded-md text-xs text-red-400 hover:bg-red-950/20 transition-colors" title="削除した記事のIDをコピーしてAIに渡せます">
                            🗑️
                        </button>
                    </div>
                </div>
            </div>
            <div id="tagContainer" class="mt-4 flex flex-wrap gap-2 items-center min-h-[32px] border-t border-[#1d1d22] pt-3">
                <span class="text-[9px] font-bold text-[#8e8e93] uppercase tracking-widest mr-1">Top Focus Tags:</span>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p class="text-[9px] text-[#8e8e93] font-medium tracking-tight">最終アップデート: {{last_updated}}</p>
                <a href="./data/notebooklm_master.md" target="_blank" class="text-[9px] text-[#e8c3b9] hover:underline font-bold tracking-tight">📝 NotebookLM用統合ソースを開く</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div id="articlesGrid">
            <!-- ARTICLES_PLACEHOLDER -->
        </div>
    </main>

    <footer class="bg-[#101012] border-t border-[#1d1d22] mt-20">
        <div class="max-w-7xl mx-auto px-4 py-10 text-center text-[#8e8e93] text-xs">
            <p class="mb-2 font-bold tracking-widest text-[#c8968c]">VESPER</p>
            <p>&copy; 2026 Vesper - AI-Driven Premium Curation Platform</p>
        </div>
    </footer>

    <script>
        let currentPriority = 'all';
        let currentTag = 'all';
        let showRead = true;
        const searchInput = document.getElementById('searchInput');

        function updateDisplay() {
            const searchTerm = searchInput.value.toLowerCase();
            const articles = document.querySelectorAll('.article-card');
            let visibleCount = 0;
            
            // 統計用の集計
            const stats = { all: 0, high: 0, medium: 0, low: 0, read: 0, total: 0 };

            articles.forEach(card => {
                const title = card.dataset.title.toLowerCase();
                const summary = card.dataset.summary.toLowerCase();
                const priority = card.dataset.priority.toLowerCase();
                const tags = card.dataset.tags.toLowerCase().split(',');
                const isRead = card.classList.contains('status-read');
                const isDeleted = localStorage.getItem(`deleted_${card.dataset.articleId}`) === 'true';

                if (isDeleted) {
                    card.style.display = 'none';
                    return;
                }

                stats.total++;
                stats.all++;
                stats[priority] = (stats[priority] || 0) + 1;
                if (isRead) stats.read++;

                const matchesSearch = title.includes(searchTerm) || summary.includes(searchTerm);
                const matchesPriority = currentPriority === 'all' || priority === currentPriority;
                const matchesTag = currentTag === 'all' || tags.includes(currentTag);
                const matchesReadFilter = showRead || !isRead;

                if (matchesSearch && matchesPriority && matchesTag && matchesReadFilter) {
                    card.classList.remove('hidden-item');
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.classList.add('hidden-item');
                    setTimeout(() => {
                        if (card.classList.contains('hidden-item')) card.style.display = 'none';
                    }, 350);
                }
            });

            // 統計UIの更新
            updateStatsUI(stats);
            document.getElementById('searchCount').textContent = `${visibleCount}件`;
        }

        function updateStatsUI(stats) {
            document.getElementById('count-all').textContent = stats.all;
            document.getElementById('count-high').textContent = stats.high;
            document.getElementById('count-medium').textContent = stats.medium;
            document.getElementById('count-low').textContent = stats.low;

            const progress = stats.total > 0 ? Math.round((stats.read / stats.total) * 100) : 0;
            document.getElementById('progressPercent').textContent = `${progress}%`;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        function renderTags() {
            const container = document.getElementById('tagContainer');
            const articles = document.querySelectorAll('.article-card');
            const tagCounts = {};
            
            articles.forEach(card => {
                const isDeleted = localStorage.getItem(`deleted_${card.dataset.articleId}`) === 'true';
                if (isDeleted) return;
                
                const tags = card.dataset.tags.split(',').filter(t => t);
                tags.forEach(tag => {
                    tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                });
            });

            const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);
            const isExpanded = container.dataset.expanded === 'true';
            const limit = 15;
            
            container.innerHTML = '<span class="text-[9px] font-bold text-[#8e8e93] uppercase tracking-widest mr-1">Top Focus Tags:</span>';
            
            // "ALL" タグボタン
            const allBtn = document.createElement('button');
            allBtn.onclick = () => filterTag('all');
            allBtn.className = `tag-btn inline-flex items-center px-2 py-0.5 rounded text-[9px] font-bold transition-all ${currentTag === 'all' ? 'bg-[#c8968c] text-[#121214] shadow-md' : 'bg-[#1a1a1f] text-[#a1a1aa] hover:bg-[#222228]'}`;
            allBtn.textContent = 'ALL';
            container.appendChild(allBtn);

            sortedTags.forEach(([tag, count], index) => {
                if (!isExpanded && index >= limit) return;
                
                const btn = document.createElement('button');
                btn.onclick = () => filterTag(tag);
                btn.className = `tag-btn inline-flex items-center px-2 py-0.5 rounded text-[9px] font-bold transition-all ${currentTag === tag ? 'bg-[#c8968c] text-[#121214] shadow-md' : 'bg-[#1a1a1f] text-[#c8968c] border border-[#2c2c34]/50 hover:bg-[#222228]'}`;
                btn.dataset.tag = tag;
                btn.textContent = `${tag.toUpperCase()} (${count})`;
                container.appendChild(btn);
            });

            if (sortedTags.length > limit) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'text-[9px] font-bold text-[#e8c3b9] hover:text-white ml-2 uppercase tracking-tighter transition-colors';
                toggleBtn.textContent = isExpanded ? 'Show Less' : `+${sortedTags.length - limit} more`;
                toggleBtn.onclick = () => {
                    container.dataset.expanded = isExpanded ? 'false' : 'true';
                    renderTags();
                };
                container.appendChild(toggleBtn);
            }
        }

        function toggleStatus(articleId) {
            const card = document.querySelector(`[data-article-id="${articleId}"]`);
            const isRead = card.classList.toggle('status-read');
            
            const btn = card.querySelector('.toggle-status-btn');
            btn.textContent = isRead ? '未読に戻す' : '既読にする';
            
            // 状態の永続化
            localStorage.setItem(`status_${articleId}`, isRead ? 'read' : 'unread');
            updateDisplay();
        }

        function deleteArticle(articleId) {
            if (confirm('この記事をダッシュボードから非表示にしますか？（Raindrop側は削除されません）')) {
                localStorage.setItem(`deleted_${articleId}`, 'true');
                updateDisplay();
                renderTags();
            }
        }

        function copyReadIds() {
            const readIds = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('status_') && localStorage.getItem(key) === 'read') {
                    readIds.push(key.replace('status_', ''));
                }
            }
            if (readIds.length === 0) {
                alert('既読にした記事はありません。');
                return;
            }
            navigator.clipboard.writeText(readIds.join(', ')).then(() => {
                alert(`${readIds.length}件の既読IDをクリップボードにコピーしました。これをAIまたはスクリプトに渡して「以下のIDの記事をbookmarks.jsonで既読にして」と指示できます。`);
            });
        }

        function copyDeletedIds() {
            const deletedIds = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('deleted_') && localStorage.getItem(key) === 'true') {
                    deletedIds.push(key.replace('deleted_', ''));
                }
            }
            if (deletedIds.length === 0) {
                alert('削除済みの記事はありません。');
                return;
            }
            navigator.clipboard.writeText(deletedIds.join(', ')).then(() => {
                alert(`${deletedIds.length}件の削除済みIDをクリップボードにコピーしました。これをAIに渡して「以下のIDの記事をbookmarks.jsonから完全に削除して」と指示できます。`);
            });
        }

        function filterPriority(priority) {
            currentPriority = priority;
            document.querySelectorAll('.priority-btn').forEach(btn => {
                if (btn.dataset.priority === priority) {
                    btn.classList.add('filter-active');
                } else {
                    btn.classList.remove('filter-active');
                }
            });
            updateDisplay();
        }

        function filterTag(tag) {
            currentTag = tag;
            renderTags();
            updateDisplay();
        }

        function toggleShowRead() {
            showRead = !showRead;
            const btn = document.getElementById('toggleReadBtn');
            btn.textContent = showRead ? '既読を表示中' : '未読のみ表示';
            updateDisplay();
        }

        // 初期化: localStorageから既読状態を復元
        function init() {
            document.querySelectorAll('.article-card').forEach(card => {
                const id = card.dataset.articleId;
                const status = localStorage.getItem(`status_${id}`);
                if (status === 'read') {
                    card.classList.add('status-read');
                    card.querySelector('.toggle-status-btn').textContent = '未読に戻す';
                }
            });
            
            searchInput.addEventListener('input', updateDisplay);
            renderTags();
            updateDisplay();
        }

        window.onload = init;

        // PWA Service Worker 登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Vesper PWA Service Worker 登録完了:', reg.scope))
                    .catch(err => console.error('Vesper PWA Service Worker 登録失敗:', err));
            });
        }
    </script>
</body>
</html>
